# Unit tests (README: Layout, tests/). The patched modules aren't built here:
# alpine-module/build.sh (Docker) or fetch.sh (the prebuilt release).
name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        # 3.9: Apple's /usr/bin/python3, which the README's venv uses (with tomli)
        python: ["3.9", "3.12", "3.13"]
    runs-on: ubuntu-24.04            # ubuntu-latest (26.04) has no Python 3.9
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "${{ matrix.python }}"}
      - if: matrix.python == '3.9'
        run: pip install tomli
      - run: python -m unittest discover tests
