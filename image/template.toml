# Template for an image config: everything that ends up on the Pi's SD card.
# Copy it to image/<name>.toml (gitignored), add your gadgets, then:
#   build_card.py image/<name>.toml [--install /Volumes/ALPINE]
# Secrets stay in the files referenced under [access].

[alpine]
# The alpine-rpi release, from
# https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/<arch>/latest-releases.yaml
# (flavor alpine-rpi: its version and sha256). The patched kernel modules must
# be built for this release's kernel (see alpine-module/inside.sh).
version = "3.24.2"
arch = "aarch64"
sha256 = "60e6b9f49ec3d2c9660f2ef775f5af3a98cfd2f939c8f55b6f215d00e5ffcb87"

[system]
hostname = "usbpi"
# Installed at every boot (Alpine runs diskless from RAM): from the card's
# bundled apks/, and for anything Alpine doesn't bundle, from the card's cache/
# that build_card.py fills (recorded in image/packages.lock).
packages = [
  "alpine-base", "openssh", "wpa_supplicant", "ifupdown-ng", "chrony", "iw",  # Wi-Fi, SSH, time
  "alsa-utils",  # arecord/aplay, amixer
  "python3",     # for audio logic on the Pi
]
# For "apk add" on the running Pi, and where cached packages come from
# (match the release branch above).
repositories = [
  "https://dl-cdn.alpinelinux.org/alpine/v3.24/main",
  "https://dl-cdn.alpinelinux.org/alpine/v3.24/community",
]
# Loaded by the "modules" service. libcomposite is loaded later, from
# [kernel_modules]: loading the stock one here would block the patched one.
boot_modules = ["af_packet", "ipv6", "brcmfmac", "dwc2"]
# usercfg.txt on the boot partition; dwc2 in peripheral mode makes the Pi a USB device
boot_config = ["dtoverlay=dwc2,dr_mode=peripheral"]

[services]
# "local" runs /etc/local.d/*.start: patched modules, debug console, boot gadget.
boot = ["local"]
# wpa_supplicant/networking in "default": by then the boot runlevel has loaded
# the Wi-Fi driver and wlan0 exists.
default = ["wpa_supplicant", "networking", "sshd", "chronyd"]

[access]
wifi = "wifi.local"      # file with SSID, PASSWORD, COUNTRY lines (gitignored)
ssh_public_key = "~/.ssh/id_ed25519.pub"  # root login, key only
debug_console = true     # USB serial root shell until a gadget takes the port

[kernel_modules]
# Patched gadget modules (alpine-module/build.sh output), loaded at boot in
# this order before anything can pull in the stock ones. Remove this section
# to use Alpine's stock modules (gadget plans are then made for those).
dir = "out/modules"
load = ["libcomposite", "u_audio", "u_serial", "usb_f_acm", "usb_f_uac1", "usb_f_hid"]

# Gadgets: a usb-capture capture (what the device looks like; ~/Code/usb-capture) plus
# gadget_plan.py options (how to clone it). build_card.py combines them into
# gadgets/<name>.plan (gitignored) and puts the plan on the card.
# [gadgets.mydevice]
# capture = "../usb-capture/captures/mydevice.json"   # relative to this repo
# max_speed = ""     # "" = as captured, or "full-speed" / "high-speed"
# test_ids = false   # true: VID:PID 1209:0001 instead of the captured IDs

[boot]
gadget = ""        # a [gadgets] name to start at boot; "" = debug console only
