# heartbeat, the smallest app (README: Apps), release config:
#   build_card.py examples/heartbeat/pi.toml [--install /Volumes/ALPINE]
# pi-dev.toml includes this one and adds the ways in.
# No python3 (the smallest image): slot.sh status, switch and commit work, but
# slot.sh try can't (its reboot needs python3); add "python3" to packages to try
# a second image in b/ (README: Image slots).

[image]
type = "initramfs"

[alpine]
version = "3.24.2"
arch = "aarch64"
sha256 = "60e6b9f49ec3d2c9660f2ef775f5af3a98cfd2f939c8f55b6f215d00e5ffcb87"

[system]
hostname = "heartbeat"
packages = ["alpine-release", "ca-certificates-bundle", "openssh", "chrony"]  # os-release, CA certificates
repositories = [
  "https://dl-cdn.alpinelinux.org/alpine/v3.24/main",
  "https://dl-cdn.alpinelinux.org/alpine/v3.24/community",
]

[access]
wifi = ""                                 # or "wifi.local" (SSID, PASSWORD, COUNTRY lines)
ssh_public_key = ""
debug_console = false

[device]
description = "device.toml"
start_at_boot = true
console = false

[app]
name = "heartbeat"
files = { "opt/heartbeat/run.sh" = "app/run.sh" }
run = "/opt/heartbeat/run.sh"
state = true                                  # /var/lib/heartbeat is the card's heartbeat/
keep_logs = true                              # /var/log on the card: logs/last, logs/prev
config_txt = ["dtparam=act_led_trigger=none"] # the LED stays dark until the app blinks it
# on the card's settings.txt as heartbeat.blink; run.sh gets $APP_SETTING_BLINK
settings = { blink = { default = "1", help = "Seconds between blinks: 1 to 10." } }
